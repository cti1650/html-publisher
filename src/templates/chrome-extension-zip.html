<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Extension Builder</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <!--
    拡張機能に含めるファイル。data-path がZIP内のパスになる。
    type="text/plain" なので実行はされないが、HTML Publisher の security_check は .js の中身もJSとして解析する。
    manifest.json は JS として解析させないよう type="application/json" にする。
    中身に "</script>" を含める場合は "<\/script>" と書くこと。
  -->
  <!-- EXTENSION_FILES:START -->
  <script type="application/json" data-path="manifest.json">
{
  "manifest_version": 3,
  "name": "Example Banner",
  "version": "1.0.0",
  "description": "example.com の上部にバナーを表示するサンプル",
  "content_scripts": [
    {
      "matches": ["https://example.com/*"],
      "js": ["content.js"],
      "run_at": "document_idle"
    }
  ]
}
  </script>

  <script type="text/plain" data-path="content.js">
(function () {
  "use strict";
  const banner = document.createElement("div");
  banner.textContent = "拡張機能が動作しています";
  banner.style.cssText =
    "position:fixed;top:0;left:0;right:0;z-index:99999;padding:8px;background:#16a34a;color:#fff;text-align:center;font:14px sans-serif";
  document.body.appendChild(banner);
})();
  </script>
  <!-- EXTENSION_FILES:END -->

  <main class="mx-auto max-w-3xl space-y-6 p-4 sm:p-8">
    <header>
      <h1 id="extension-name" class="text-2xl font-bold">Chrome 拡張機能</h1>
      <p id="extension-description" class="text-slate-600"></p>
    </header>

    <section class="rounded-lg bg-white p-4 shadow-sm">
      <h2 class="mb-2 font-bold">この拡張機能が要求するもの</h2>
      <p class="mb-3 text-sm text-slate-500">導入前に、動作するサイトと権限が意図どおりか確認してください。</p>
      <dl id="permissions" class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 text-sm"></dl>
      <p id="permissions-warning" class="mt-3 hidden rounded bg-amber-50 p-2 text-sm text-amber-800"></p>
    </section>

    <section class="rounded-lg bg-white p-4 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="font-bold">ダウンロード</h2>
        <button type="button" id="download-button" class="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700">
          ZIPをダウンロード
        </button>
        <a id="download-link" download hidden></a>
      </div>
      <p id="download-error" role="alert" class="mt-2 hidden text-sm text-red-700"></p>
      <h3 class="mt-4 mb-1 font-bold">導入手順</h3>
      <ol class="list-decimal space-y-1 pl-5 text-sm">
        <li>「ZIPをダウンロード」を押し、ダウンロードしたZIPを展開する</li>
        <li>Chrome で <code class="rounded bg-slate-100 px-1">chrome://extensions</code> を開く</li>
        <li>右上の「デベロッパーモード」をオンにする</li>
        <li>「パッケージ化されていない拡張機能を読み込む」を押し、展開したフォルダを選ぶ</li>
      </ol>
      <p class="mt-2 text-xs text-slate-500">展開したフォルダを削除すると拡張機能も動かなくなります。残しておける場所に展開してください。</p>
    </section>

    <section class="rounded-lg bg-white p-4 shadow-sm">
      <h2 class="mb-2 font-bold">含まれるファイル</h2>
      <div id="file-list" class="space-y-3"></div>
    </section>
  </main>

  <script>
    const files = [...document.querySelectorAll("script[data-path]")].map((el) => ({
      path: el.dataset.path,
      content: el.textContent.trim() + "\n",
    }));

    let manifest = {};
    try {
      manifest = JSON.parse(files.find((f) => f.path === "manifest.json").content);
    } catch (e) {
      const el = document.getElementById("download-error");
      el.textContent = "manifest.json を読み取れません: " + e.message;
      el.classList.remove("hidden");
    }

    const extensionName = manifest.name || "extension";
    document.title = extensionName;
    document.getElementById("extension-name").textContent = extensionName;
    document.getElementById("extension-description").textContent = manifest.description || "";

    // 権限と対象サイトの一覧
    const matches = (manifest.content_scripts || []).flatMap((cs) => cs.matches || []);
    const rows = [
      ["対象サイト", matches],
      ["permissions", manifest.permissions || []],
      ["host_permissions", manifest.host_permissions || []],
    ];
    const permissionsEl = document.getElementById("permissions");
    for (const [label, list] of rows) {
      if (!list.length) continue;
      const dt = document.createElement("dt");
      dt.className = "font-mono text-slate-500";
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.className = "font-mono break-all";
      dd.textContent = list.join(", ");
      permissionsEl.append(dt, dd);
    }

    const broad = [...matches, ...(manifest.host_permissions || [])].some((m) =>
      /^<all_urls>$|^\*:\/\/\*\/\*$/.test(m)
    );
    const sensitive = (manifest.permissions || []).filter((p) =>
      ["cookies", "history", "webRequest", "debugger", "tabs", "downloads", "management"].includes(p)
    );
    const warnings = [];
    if (broad) warnings.push("すべてのサイトで動作する設定です。");
    if (sensitive.length) warnings.push("閲覧データに触れる権限を要求しています（" + sensitive.join(", ") + "）。");
    if (warnings.length) {
      const el = document.getElementById("permissions-warning");
      el.textContent = "注意: " + warnings.join(" ");
      el.classList.remove("hidden");
    }

    const fileList = document.getElementById("file-list");
    for (const file of files) {
      const details = document.createElement("details");
      details.className = "rounded border border-slate-200";
      const summary = document.createElement("summary");
      summary.className = "cursor-pointer px-3 py-2 font-mono text-sm";
      summary.textContent = file.path;
      const pre = document.createElement("pre");
      pre.className = "overflow-x-auto bg-slate-50 p-3 text-xs";
      pre.textContent = file.content;
      details.append(summary, pre);
      fileList.append(details);
    }

    // ===== 無圧縮ZIP（STORE）の生成 =====
    // 拡張機能のような小さなファイル群なら圧縮しなくても困らないため、外部ライブラリに頼らずに組み立てる
    const CRC_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        table[n] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    function dosDateTime(date) {
      const time = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
      const day = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { time, day };
    }

    function buildZip(entries) {
      const encoder = new TextEncoder();
      const { time, day } = dosDateTime(new Date());
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const entry of entries) {
        const name = encoder.encode(entry.path);
        const data = encoder.encode(entry.content);
        const crc = crc32(data);

        const local = new DataView(new ArrayBuffer(30));
        local.setUint32(0, 0x04034b50, true); // local file header signature
        local.setUint16(4, 20, true); // version needed
        local.setUint16(6, 0x0800, true); // UTF-8 のファイル名
        local.setUint16(8, 0, true); // STORE（無圧縮）
        local.setUint16(10, time, true);
        local.setUint16(12, day, true);
        local.setUint32(14, crc, true);
        local.setUint32(18, data.length, true);
        local.setUint32(22, data.length, true);
        local.setUint16(26, name.length, true);
        local.setUint16(28, 0, true);
        localParts.push(new Uint8Array(local.buffer), name, data);

        const central = new DataView(new ArrayBuffer(46));
        central.setUint32(0, 0x02014b50, true); // central directory signature
        central.setUint16(4, 20, true); // version made by
        central.setUint16(6, 20, true); // version needed
        central.setUint16(8, 0x0800, true);
        central.setUint16(10, 0, true);
        central.setUint16(12, time, true);
        central.setUint16(14, day, true);
        central.setUint32(16, crc, true);
        central.setUint32(20, data.length, true);
        central.setUint32(24, data.length, true);
        central.setUint16(28, name.length, true);
        central.setUint32(42, offset, true); // local header の位置
        centralParts.push(new Uint8Array(central.buffer), name);

        offset += 30 + name.length + data.length;
      }

      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); // end of central directory signature
      end.setUint16(8, entries.length, true);
      end.setUint16(10, entries.length, true);
      end.setUint32(12, centralSize, true);
      end.setUint32(16, offset, true);

      return new Blob([...localParts, ...centralParts, new Uint8Array(end.buffer)], { type: "application/zip" });
    }

    document.getElementById("download-button").addEventListener("click", () => {
      const zip = buildZip(files);
      const link = document.getElementById("download-link");
      const fileName = extensionName.replace(/[\\/:*?"<>|\s]+/g, "-") + "-" + (manifest.version || "0.0.0") + ".zip";
      link.href = URL.createObjectURL(zip);
      link.download = fileName;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    });
  </script>
</body>
</html>
